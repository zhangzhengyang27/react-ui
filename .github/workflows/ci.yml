# 门禁与本地一致：lint（含棘轮 max-warnings）→ typecheck ×3 → 构建发布包 → exports 校验 → 全部单测。
# check:exports 校验的是磁盘上 exports 指向的真实文件，必须排在 build:packages 之后；
# 单测经 workspace 协议解析 hooks 等依赖的 es/ 产物，同样放在构建后。
# e2e（interactions / screenshots）暂不入 CI：截图基线跨平台不通用，见 ADMIN-ROADMAP 的遗留项。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint（eslint 棘轮 + stylelint + spellcheck）
        run: pnpm lint

      - name: Typecheck（ui + hooks + demos）
        run: pnpm typecheck

      - name: 构建发布包
        run: pnpm build:packages

      - name: 校验包导出
        run: pnpm check:exports

      - name: 单元测试（全部 workspace 包）
        run: pnpm test:packages
